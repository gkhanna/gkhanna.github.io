name: Auto-deploy Backyard Gallery

on:
  push:
    paths:
      - 'backyard/data/manifest.json'
      - 'backyard/images/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify gallery files
        run: |
          if [ -f backyard/data/manifest.json ]; then
            echo "✓ Gallery manifest present"
            jq . backyard/data/manifest.json
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./backyard
          destination_dir: backyard
